---
layout: wide
title: Gallery
description: Photography and modern origami by Ziche Liu.
gallery: true
nav:
  - [Homepage, "/"]
---

<div class="ghead">
  <h1>Photography &amp; Origami</h1>
  <span class="sub">Click to enlarge &middot; &larr;&rarr; to browse &middot; ESC to close</span>
</div>

<div class="ctl">
  <div class="ctl-g"><b>Layout</b>
    <button data-mode="justified" class="on">Justified</button>
    <button data-mode="masonry">Masonry</button>
  </div>
  <div class="ctl-g"><b>Size</b>
    <button data-size="220">Compact</button>
    <button data-size="320" class="on">Comfortable</button>
    <button data-size="440">Large</button>
  </div>
  <div class="ctl-g"><b>Filter</b>
    <button data-filter="all" class="on">All</button>
    <button data-filter="photo">Photos</button>
    <button data-filter="origami">Origami</button>
  </div>
</div>

<div id="grid" data-manifest="{{ '/gallery/photos.json' | relative_url }}"></div>

<!-- Lightbox -->
<div id="light" hidden tabindex="-1" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="light-x" aria-label="Close">&times;</button>

  <button class="edge nav-prev" id="light-prev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg></button>
  <button class="edge nav-next" id="light-next" aria-label="Next photo">
    <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg></button>

  <div id="light-stage">
    <figure id="light-fig"><img id="light-img" alt=""></figure>
  </div>

  <div id="light-bar">
    <div id="light-cap"></div>
    <div id="light-nav">
      <button class="nav-prev" aria-label="Previous photo">&lsaquo;</button>
      <span id="light-cnt"></span>
      <button class="nav-next" aria-label="Next photo">&rsaquo;</button>
    </div>
  </div>
</div>
