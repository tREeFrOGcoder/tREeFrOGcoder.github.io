<header>
  <nav aria-label="Sections">
    {%- for item in page.nav -%}
      <a href="{{ item[1] }}">{{ item[0] }}</a>
    {%- endfor -%}
    {%- unless page.nav -%}
      <a href="{{ '/' | relative_url }}">Homepage</a>
    {%- endunless -%}
  </nav>

  <button class="theme-btn" type="button" aria-label="Toggle dark mode" aria-pressed="false">
    <svg class="sunmoon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <g class="ic sun">
        <circle cx="12" cy="12" r="4.2"/>
        <line x1="12" y1="1.7" x2="12" y2="3.6"/><line x1="12" y1="20.4" x2="12" y2="22.3"/>
        <line x1="1.7" y1="12" x2="3.6" y2="12"/><line x1="20.4" y1="12" x2="22.3" y2="12"/>
        <line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/>
        <line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/>
      </g>
      <path class="ic moon" d="M20.7 13.4A8.6 8.6 0 1 1 10.6 3.3 6.7 6.7 0 0 0 20.7 13.4z"/>
    </svg>
  </button>
</header>
